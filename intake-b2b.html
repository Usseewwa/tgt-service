<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGT Service - B2B Возвраты</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex overflow-hidden text-base">

<aside class="w-64 bg-slate-900 text-white flex flex-col shadow-lg z-25 shrink-0"></aside>

    <!-- Основной контент -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10 shrink-0">
            <h1 class="text-2xl font-bold text-indigo-900"><i class="fa-solid fa-boxes-packing mr-2"></i>Приемка возвратов и брака (B2B)</h1>
            <div class="flex items-center space-x-4">
                <span class="text-base text-slate-500 bg-slate-100 px-3 py-1 rounded-full"><i class="fa-solid fa-user mr-2"></i> Оператор: Иванова А.С.</span>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-8">
            <form class="max-w-4xl mx-auto space-y-6" onsubmit="submitB2BForm(event)">
                
                <div class="bg-indigo-50 rounded-xl shadow-sm border border-indigo-200 p-6 space-y-6">
                    <h2 class="text-lg font-bold text-indigo-900 border-b border-indigo-200 pb-2">Параметры партии / возврата</h2>
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-indigo-700 mb-1">Источник (Маркетплейс)</label>
                            <select class="w-full border border-indigo-300 rounded-lg p-2.5 text-base outline-none bg-white">
                                <option>Wildberries</option>
                                <option>Ozon</option>
                                <option>Яндекс Маркет</option>
                                <option>Брак с поставки</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-indigo-700 mb-1">Штрихкод товара (ШК)</label>
                            <input type="text" class="w-full border border-indigo-300 rounded-lg p-2.5 text-base outline-none bg-white" placeholder="Сканируйте штрихкод...">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-indigo-700 mb-1">Артикул / Модель</label>
                            <input type="text" class="w-full border border-indigo-300 rounded-lg p-2.5 text-base outline-none bg-white" value="R101-200 (Кухонный комбайн)">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-indigo-700 mb-1">Количество (для групповой приемки)</label>
                            <input type="number" id="b2b-qty" value="1" min="1" class="w-full border border-indigo-300 rounded-lg p-2.5 text-base outline-none bg-white">
                        </div>
                        <div class="col-span-2 flex items-center space-x-3 bg-white p-3 rounded-lg border border-indigo-200">
                            <input type="checkbox" id="sync-1c" class="w-5 h-5 text-indigo-600 rounded">
                            <label for="sync-1c" class="text-base font-medium text-indigo-900">Автоматически провести в 1С</label>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-bold text-indigo-700 mb-1">Примечание / Внешний вид коробки</label>
                            <textarea class="w-full border border-indigo-300 rounded-lg p-3 text-base outline-none h-20 resize-none bg-white" placeholder="Например: Повреждена заводская упаковка, вскрыт скотч..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Кнопки -->
                <div class="flex justify-end space-x-4 pt-4">
                    <a href="queue.html" class="px-6 py-3 border border-slate-300 rounded-lg text-slate-700 text-base font-medium hover:bg-slate-50 transition bg-white">Отмена</a>
                    <button type="submit" class="px-8 py-3 bg-indigo-600 text-white rounded-lg text-base font-medium hover:bg-indigo-700 shadow-sm transition">Сгенерировать этикетки и оприходовать</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Модалка сгенерированных этикеток -->
    <div id="modal-labels" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 m-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-slate-800">Этикетки для печати</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <p class="text-sm text-slate-600 mb-4">Созданы следующие номера возвратов:</p>
            <div id="label-list" class="bg-slate-100 p-4 rounded-lg max-h-60 overflow-y-auto font-mono text-sm space-y-2 mb-6 border border-slate-200"></div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 border rounded-lg text-slate-600 text-sm font-medium hover:bg-slate-50">Закрыть</button>
                <button onclick="alert('Отправка на принтер этикеток...'); closeModal();" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-900 shadow-sm"><i class="fa-solid fa-print mr-1"></i> Печать</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
