<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGT Service - Настройки</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex overflow-hidden text-base">

<aside class="w-64 bg-slate-900 text-white flex flex-col shadow-lg z-25 shrink-0"></aside>


    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="h-16 bg-white shadow-sm flex items-center px-6 z-10 shrink-0">
            <h1 class="text-lg font-bold text-slate-800">Настройки</h1>
        </header>

        <div class="flex-1 overflow-auto p-6 max-w-5xl mx-auto w-full">
            <div class="flex border-b mb-4 space-x-4">
                <button onclick="switchSettingsTab('loc')" id="stab-btn-loc" class="tab-btn py-2 active text-sm">Локации</button>
                <button onclick="switchSettingsTab('users')" id="stab-btn-users" class="tab-btn py-2 text-slate-500 text-sm">Сотрудники</button>
            </div>

            <div id="settings-content-loc" class="tab-content bg-white rounded-xl border overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b"><tr><th class="p-3">Код</th><th class="p-3">Название</th><th class="p-3">Тип</th><th class="p-3">Регион</th></tr></thead>
                    <tbody class="divide-y">
                        <tr><td class="p-3 font-mono font-bold">701</td><td class="p-3">Главный СЦ</td><td class="p-3"><span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-bold">СЦ</span></td><td class="p-3">Минск</td></tr>
                        <tr><td class="p-3 font-mono font-bold">702</td><td class="p-3">ППВ Дзержинского</td><td class="p-3"><span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold">ППВ</span></td><td class="p-3">Минск</td></tr>
                        <tr><td class="p-3 font-mono font-bold">451</td><td class="p-3">АСЦ Салби-Плюс</td><td class="p-3"><span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs font-bold">Партнер</span></td><td class="p-3">Гродно</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="settings-content-users" class="tab-content hidden bg-white rounded-xl border overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b"><tr><th class="p-3">ФИО</th><th class="p-3">Роль</th><th class="p-3">Локация</th><th class="p-3">Логин</th></tr></thead>
                    <tbody class="divide-y">
                        <tr><td class="p-3">Иванова А.С.</td><td class="p-3 text-slate-600">Приемщик</td><td class="p-3">ППВ Дзержинского</td><td class="p-3 font-mono text-slate-500">ivanova</td></tr>
                        <tr><td class="p-3">Петров И.И.</td><td class="p-3 text-blue-600 font-bold">Инженер</td><td class="p-3">Главный СЦ</td><td class="p-3 font-mono text-slate-500">petrov</td></tr>
                        <tr><td class="p-3">Сидоров В.В.</td><td class="p-3 text-purple-600 font-bold">Админ АСЦ</td><td class="p-3">АСЦ Салби</td><td class="p-3 font-mono text-slate-500">sidorov</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
