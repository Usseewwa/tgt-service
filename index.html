<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGT Service - Аналитика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex overflow-hidden text-base">

<aside class="w-64 bg-slate-900 text-white flex flex-col shadow-lg z-25 shrink-0"></aside>




    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="h-16 bg-white shadow-sm flex items-center px-6 z-10 justify-between shrink-0">
            <h1 class="text-lg font-bold text-slate-800">Аналитика и KPI</h1>
            <div class="text-xs font-medium bg-slate-100 px-3 py-1 rounded-full"><i class="fa-solid fa-user-circle text-slate-400 mr-1"></i> Администратор</div>
        </header>

        <div class="flex-1 overflow-auto p-6 max-w-7xl mx-auto w-full">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl border"><div class="text-slate-500 text-xs font-bold mb-1">Всего</div><div class="text-2xl font-bold">1 248</div></div>
                <div onclick="window.location.href='?modal=active'" class="bg-white p-4 rounded-xl border border-orange-200 cursor-pointer hover:shadow-md transition">
                    <div class="text-orange-500 text-xs font-bold mb-1">В работе</div><div class="text-2xl font-bold text-orange-600">34</div>
                </div>
                <div onclick="window.location.href='?modal=overdue'" class="bg-white p-4 rounded-xl border border-red-200 cursor-pointer hover:shadow-md transition">
                    <div class="text-red-500 text-xs font-bold mb-1">Просрочено</div><div class="text-2xl font-bold text-red-600">2</div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-green-200"><div class="text-green-600 text-xs font-bold mb-1">Закрыто (мес)</div><div class="text-2xl font-bold text-green-700">412</div></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-6">
                <div class="bg-white rounded-xl border p-6">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">KPI Инженеров</h2>
                    <table class="w-full text-left text-sm">
                        <thead class="text-slate-500 border-b"><tr><th class="p-2">Инженер</th><th class="p-2 text-center">Закрыто</th><th class="p-2 w-1/3">План</th></tr></thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr onclick="openEngineerModal('Петров И.И.', 42, '1.5 дня')" class="hover:bg-blue-50 cursor-pointer group">
                                <td class="p-3 font-medium flex items-center"><i class="fa-solid fa-user-circle text-slate-400 mr-2 text-lg"></i> Петров И.И. <i class="fa-solid fa-chevron-right ml-auto text-slate-300 text-xs"></i></td>
                                <td class="p-3 text-center font-bold">42</td>
                                <td class="p-3"><div class="w-full bg-slate-100 rounded-full h-2.5"><div class="bg-green-500 h-2.5 rounded-full" style="width: 95%"></div></div><div class="text-xs text-green-600 font-bold mt-1">95%</div></td>
                            </tr>
                            <tr onclick="openEngineerModal('Смирнов А.В.', 38, '2.1 дня')" class="hover:bg-blue-50 cursor-pointer group">
                                <td class="p-3 font-medium flex items-center"><i class="fa-solid fa-user-circle text-slate-400 mr-2 text-lg"></i> Смирнов А.В. <i class="fa-solid fa-chevron-right ml-auto text-slate-300 text-xs"></i></td>
                                <td class="p-3 text-center font-bold">38</td>
                                <td class="p-3"><div class="w-full bg-slate-100 rounded-full h-2.5"><div class="bg-yellow-500 h-2.5 rounded-full" style="width: 82%"></div></div><div class="text-xs text-yellow-600 font-bold mt-1">82%</div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="bg-white rounded-xl border p-6 flex flex-col items-center justify-center text-center">
                    <h2 class="text-lg font-bold mb-2">Типы работ</h2>
                    <div class="w-32 h-32 rounded-full border-8 border-blue-500 border-r-yellow-400 border-b-red-400 relative flex flex-col items-center justify-center my-4 shadow-inner">
                        <span class="text-2xl font-extrabold">412</span>
                        <span class="text-[9px] text-slate-500 uppercase font-bold tracking-widest mt-1">Ремонтов</span>
                    </div>
                    <div class="text-sm text-slate-600 space-y-1 text-left w-full">
                        <div><i class="fa-solid fa-circle text-blue-500 mr-2"></i> Замена ЗЧ (60%)</div>
                        <div><i class="fa-solid fa-circle text-yellow-400 mr-2"></i> Чистка (25%)</div>
                        <div><i class="fa-solid fa-circle text-red-400 mr-2"></i> Сложный (15%)</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Модалки -->
    <div id="modal-stats" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 m-4">
            <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold" id="stats-title">Список</h3><button onclick="closeStatsModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <div class="max-h-[60vh] overflow-y-auto">
                <table class="w-full text-sm border"><thead class="bg-slate-50 sticky top-0"><tr><th class="p-2">Заказ</th><th class="p-2">Инженер</th><th class="p-2">Дедлайн</th></tr></thead><tbody id="stats-list" class="divide-y"></tbody></table>
            </div>
        </div>
    </div>

    <div id="modal-eng" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 m-4">
            <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold" id="eng-modal-name">Инженер</h3><button onclick="closeEngineerModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <p class="text-sm text-slate-500 mb-3" id="eng-modal-stats"></p>
            <table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-2">Заказ</th><th class="p-2">Работа</th><th class="p-2">Дата</th></tr></thead><tbody id="eng-modal-tbody" class="divide-y"></tbody></table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
