<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGT Service — Вход в систему</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4" style="font-family: 'Inter', sans-serif;">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-800 overflow-hidden">
        <!-- Шапка -->
        <div class="bg-slate-950 px-8 py-6 text-center border-b border-slate-800">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600/20 text-blue-500 mb-3">
                <i class="fa-solid fa-screwdriver-wrench text-xl"></i>
            </div>
            <h1 class="text-white font-black tracking-widest uppercase text-base" style="font-size: 13px !important;">TGT Service</h1>
            <p class="text-slate-400 text-xs mt-1">Закрытый контур сервисного центра</p>
        </div>

        <!-- Форма входа -->
        <form id="login-form" onsubmit="handleLogin(event)" class="p-8 space-y-5">
            <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg flex items-center">
                <i class="fa-solid fa-circle-exclamation mr-2 shrink-0"></i>
                <span id="login-error-text">Неверный логин или пароль</span>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Логин</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="login-username" required autocomplete="username" placeholder="Введите логин"
                        class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Пароль</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••"
                        class="w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none transition">
                    <button type="button" onclick="togglePasswordVisibility()" title="Показать или скрыть пароль"
                        class="absolute right-3 top-3 text-slate-400 hover:text-slate-600 text-sm">
                        <i id="toggle-pass-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition flex items-center justify-center">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Войти в систему
            </button>

            <!-- Демо-подсказка для визуализации -->
            <div class="pt-4 border-t border-slate-100">
                <div class="text-[11px] font-bold uppercase text-slate-400 mb-2">Быстрый вход (демо-доступ):</div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="fillDemoLogin('admin', 'admin123')"
                        class="text-left p-2 rounded-lg border border-slate-200 hover:border-blue-400 hover:bg-blue-50/50 transition">
                        <div class="font-bold text-slate-700">Администратор</div>
                        <div class="text-slate-400 font-mono text-[11px]">admin / admin123</div>
                    </button>
                    <button type="button" onclick="fillDemoLogin('petrov', '123456')"
                        class="text-left p-2 rounded-lg border border-slate-200 hover:border-blue-400 hover:bg-blue-50/50 transition">
                        <div class="font-bold text-slate-700">Инженер</div>
                        <div class="text-slate-400 font-mono text-[11px]">petrov / 123456</div>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('login-password');
            const icon = document.getElementById('toggle-pass-icon');
            if (!input || !icon) return;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        }
    </script>
</body>
</html>
