<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGT Service - Каталог техники</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex overflow-hidden text-base">

<aside class="w-64 bg-slate-900 text-white flex flex-col shadow-lg z-25 shrink-0"></aside>




    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <div class="flex-1 overflow-auto p-8 w-full max-w-7xl mx-auto">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-8 flex space-x-4 sticky top-0 z-10">
                <div class="flex-1 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-lg"></i>
                    <input type="text" id="search-appliance" placeholder="Поиск по технике..." class="w-full pl-12 pr-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 text-lg" oninput="renderCatalog(this.value)">
                </div>
            </div>

            <h2 class="text-2xl font-bold text-slate-800 mb-6">Модели на обслуживании</h2>
            <div id="appliance-grid" class="flex flex-wrap gap-6">
                <!-- Карточки техники -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
